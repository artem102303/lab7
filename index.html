<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд користувача</title>
    <link rel="stylesheet" href="layout.css">
</head>
<body>

    <header class="header">
        <div class="logo">MyBrand</div>

        <nav class="nav-menu">
            <a href="#">Головна</a>
            <a href="#">Продукти</a>
        </nav>
    </header>

    <div class="main-container">

        <aside class="sidebar">
            <a href="#">Огляд</a>
            <a href="#">Замовлення</a>
            <a href="#">Налаштування</a>
            <a href="#">Вихід</a>
        </aside>

        <main class="content">
            <h1>Популярні товари</h1>

            <div class="grid-gallery">

                <div class="card">
                    <h3>Товар 1</h3>
                    <p>Якісний товар для щоденного використання.</p>
                </div>

                <div class="card">
                    <h3>Товар 2</h3>
                    <p>Стильний та сучасний дизайн.</p>
                </div>

                <div class="card">
                    <h3>Товар 3</h3>
                    <p>Висока якість за доступною ціною.</p>
                </div>

                <div class="card">
                    <h3>Товар 4</h3>
                    <p>Популярний вибір серед покупців.</p>
                </div>

            </div>
        </main>

    </div>

</body>
</html>
